<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clay scene preview · Verse vs Verse</title><link rel="stylesheet" href="/style.css"><style>.sample-grid{display:grid;gap:12px}.sample-row{display:grid;grid-template-columns:180px repeat(3,minmax(180px,1fr));gap:8px;align-items:center;border-bottom:1px solid #ddd;padding:8px 0}.sample-frame{aspect-ratio:16/9;background:#2f2a3a;border-radius:10px;overflow:hidden}.sample-frame svg{width:100%;height:100%}.sample-label{font-size:12px;color:#81796d}.sample-line{font-weight:700}body.samples #preview-form,body.samples #message,body.samples #preview{display:none}</style></head><body><main class="dashboard"><header class="topbar"><div class="brand">CLAY SCENE <b>PREVIEW</b></div><a href="/dashboard" class="tag">BACK TO STUDIO</a></header><section class="card"><form id="preview-form" class="controls"><input id="line" maxlength="80" placeholder="Type a lyric line…" required style="flex:1"><select id="mood"><option>day</option><option>dream</option><option>night</option><option>warm</option><option>sea</option></select><button>Generate scene</button></form><p id="message" class="muted"></p><div id="preview" class="preview-canvas"></div></section><section class="card" style="margin-top:18px"><div class="topbar"><h2>Animation check: 10 lyric lines × 3 moments</h2><button id="render-samples" type="button">Render sample set</button></div><p class="muted">Deterministic renderer frames at 0.15s, 0.45s and 0.9s. These exercise different named props, mascot actions and beat motion.</p><div id="sample-gallery" class="sample-grid"></div></section><section class="card" style="margin-top:18px"><h2>Recent scenes</h2><div id="gallery" class="scene-gallery"></div></section></main><script type="module" src="/preview.js"></script></body></html>
